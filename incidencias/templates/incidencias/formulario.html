{% extends "base.html" %}

{% block titulo %}Nueva incidencia{% endblock %}

{% block contenido %}
<h1 class="mb-4">Nueva incidencia</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% for campo in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% for error in campo.errors %}
        <div class="text-danger small">{{ error }}</div>
        {% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'lista_incidencias' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
